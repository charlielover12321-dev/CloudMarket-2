# CloudMarket - global cloud market items
#
# Only materials that survive the raw-material rule can appear here. Anything with
# a value-add recipe is barred automatically; see craftable-overrides.yml to opt
# specific items back in.
#
# Per item:
#   basePrice        price when stock sits at equilibriumStock
#   floorPrice       hard minimum, however much stock piles up
#   ceilingPrice     hard maximum, however scarce it gets
#   equilibriumStock stock level at which price equals basePrice
#   initialStock     optional; seeds the cloud so day one is not empty
#   category         WOOD / ORES / FOOD / MOB_DROPS / MISC
#   enabled          set false to pull an item without deleting its config
#
# At zero stock the curve pays 2x basePrice, so a ceiling below 2x basePrice will
# bind immediately. That is fine and often what you want.
#
# ON FLOOR PRICES AND FARMS
# A floor price above zero on anything a player can farm without limit - crops,
# bamboo, sugar cane, mob drops from a spawner - is an unlimited money source. The
# curve will crash the price to the floor and then keep paying it out forever.
# Those items ship with floorPrice: 0 below. Change that only if you also keep
# limits.sell-per-item-per-hour switched on in economy.yml.
#
# This list is a starting point, not a balanced economy - tune it for your server.
# Run /marketadmin autoconfig to add every other raw material the server knows
# about, including anything a future game drop introduces.

# Materials barred from the market entirely, on top of the built-in unobtainable
# list (bedrock, barriers, command blocks, end portal frames, infested stone,
# suspicious sand, budding amethyst and similar). Add your own here.
blacklist: []

# Re-allow something from the built-in list. "Unobtainable" is server-specific - if
# a plugin lets your players get trial spawners, unblock them here rather than
# living with a wrong default.
unblock: []

