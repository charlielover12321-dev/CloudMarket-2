# CloudMarket - economy settings
# Reload with /marketadmin reload. No restart needed.

currency:
  symbol: "$"
  name-singular: "Coin"
  name-plural: "Coins"

# Balance given to a player the first time the plugin sees them.
starting-balance: 250.0

# Charged on every cloud-market buy AND sell. The money is destroyed, not paid to
# anyone. This is what stops a player selling a stack and immediately buying it
# back for a profit off rounding, and it is the main brake on long-term inflation.
# A round trip costs the player roughly twice this percentage.
tax-percent: 4.0

pay:
  minimum: 0.01
  # Transfers above this ask for /pay confirm first.
  confirm-above: 10000.0
  confirm-timeout-seconds: 30

limits:
  # Most units of a single material one player may sell to the cloud per hour.
  # 2304 is 36 stacks. Set to 0 to disable.
  #
  # Worth keeping on. The bonding curve stops one player getting a good price for
  # a huge dump, but it does not stop them parking an item at its floor price for
  # everybody else. This does.
  sell-per-item-per-hour: 2304

# Crafted goods are priced from their recipe rather than by hand.
#
# A crafted item's value is the live value of its ingredients, resolved recursively
# down to raw materials, using the cheapest recipe path. A dispenser is 7
# cobblestone + 1 bow + 1 redstone; the bow is 3 string + 3 sticks; the sticks come
# from planks, the planks from logs. Nothing here needs a price set by an admin -
# only the raw materials at the bottom of the tree do.
#
# Each crafted item keeps its OWN stock pool, so you can only buy diorite that
# somebody has actually sold. Selling diorite does not add cobblestone and quartz
# to those pools.
#
# WHY THE CEILING IS PINNED TO INGREDIENT VALUE
# The curve normally pays 2x base at zero stock, to reward being first to sell
# something scarce. For a crafted item that would mean the first seller gets double
# what the materials cost - buy ingredients, craft, sell, profit. So a crafted
# item's ceiling is its ingredient value exactly. Its curve only ever discounts
# downward from there, which keeps the "dumping crashes the price" behaviour while
# making the craft-and-sell loop impossible.
crafted:
  enabled: true

  # What fraction of ingredient value a crafted item is worth.
  #
  # 1.0 means crafting is exactly break-even before tax, so the round trip (buy
  # ingredients, craft, sell) loses you twice the tax rate. Values above 1.0 pay a
  # premium for the player's time.
  #
  # THE CEILING IS NOT ARBITRARY: crafting becomes profitable once this exceeds
  # (1 + tax) / (1 - tax). At the default 4% tax that is 1.083. The plugin
  # recalculates this from your actual tax rate at startup and refuses to load a
  # value at or above it, so you cannot accidentally open a money printer by
  # lowering the tax later.
  multiplier: 1.0

  # Stock level at which a crafted item's price starts dropping below full
  # ingredient value. Below this it pays the full rate.
  equilibrium-stock: 2048

  # Refuse tools and armour that have taken any damage. A worn diamond pickaxe
  # still technically contains 3 diamonds, and paying full value for it would let
  # players mine an item to near-destruction and still cash it out whole.
  refuse-damaged: true

leaderboard:
  refresh-seconds: 60
  size: 10

# How often balances and market stock are written to the database.
# A crash loses at most this much; everything is also saved on clean shutdown.
autosave-seconds: 300

bedrock:
  # Send Bedrock players a native input form when they need to type a number or a
  # price. Turn this off only if you are debugging Floodgate - the fallback is a
  # chat prompt, which works but is clumsier on a touchscreen.
  use-native-forms: true

vault:
  # Let other plugins read and change balances through Vault.
  register-as-provider: true
